# Пример стека Portainer за Nginx Proxy Manager (docs/deploy.md).
# network_mode: bridge — на сервере автора исчерпан пул адресов Docker; если у вас его хватает, строку можно убрать.
services:
  listok:
    image: ghcr.io/bastearima/listok:latest
    container_name: listok
    restart: unless-stopped
    network_mode: bridge
    ports:
      # Только на docker0: NPM ходит на 172.17.0.1:8097, из LAN напрямую по http не достучаться.
      - "172.17.0.1:8097:8080"
    environment:
      LISTOK_BASE_URL: https://listok.example.com   # заменить на свой домен
      # Откуда верить X-Forwarded-For: NPM приходит с адреса docker-сети (172.16.0.0/12).
      LISTOK_TRUSTED_PROXY: 172.16.0.0/12
      # Первый админ: либо раскомментировать (и потом убрать), либо взять setup-токен из логов.
      # LISTOK_ADMIN_USER: admin
      # LISTOK_ADMIN_PASSWORD: ...
      TZ: Europe/Moscow
    volumes:
      - listok-data:/data

volumes:
  listok-data:
